<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="API Météo">
  <link rel="shortcut icon" href="/public/nuageux.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <title>Mini-Station-Météo</title>
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="weather-container">
    <div class="city-search">
      <input 
        type="text"
        id="cityInput"
        placeholder="Entrez un nom de ville"
      />
      <button>OK</button>
    </div>
    <h1 id="city"></h1>
    <div id="gps"></div>
    <div id="temperature">-°C</div>
    <div id="details">Mise à jour en cours...</div>
  </div>
</body>
</html>
